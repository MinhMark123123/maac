name: maac_workspace
publish_to: none

environment:
  sdk: ^3.11.5

workspace:
  - packages/maac_mvvm
  - packages/maac_mvvm/example
  - packages/maac_mvvm_annotation
  - packages/maac_mvvm_generator
  - packages/maac_mvvm_generator/example
  - packages/maac_mvvm_with_get_it
  - packages/maac_mvvm_with_get_it/example
  - packages/maac_mvvm_with_riverpod
  - packages/maac_mvvm_with_riverpod/example
  - example

dev_dependencies:
  melos: ^7.5.1

melos:
  command:
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # Generates a link to a prefilled GitHub release creation page.
      releaseUrl: true

  scripts:
    build:
      run: melos exec -- "dart run build_runner build --delete-conflicting-outputs"
      description: "Run build_runner build for all packages."
      packageFilters:
        dependsOn: build_runner
    lint:all:
      run: melos run analyze && melos run format
      description: Run all static analysis checks.

    analyze:
      exec: dart analyze .
      description: Run `dart analyze` for all packages.

    format:
      run: melos exec dart format . --fix
      description: Run `dart format` for all packages.

    format-check:
      run: melos exec dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.

    test:select:
      run: melos exec -- flutter test
      packageFilters:
        dirExists: test
      description: Run `flutter test` for selected packages.

    test:
      run: melos run test:select --no-select
      description: Run all Flutter tests in this project.

    coverage:
      run: |
        melos exec -- flutter test --coverage &&
        melos exec -- genhtml coverage/lcov.info --output-directory=coverage/
      packageFilters:
        dirExists: test
      description: Generate coverage for the selected package.

    genTest:
      run: melos exec -- flutter pub run build_runner build
      packageFilters:
        dirExists: test
      description: Run generate with build_runner Flutter tests in this project.

    genRepair:
      run: |
        melos exec -- flutter pub cache repair &&
        flutter pub get &&
        flutter pub run build_runner build --delete-conflicting-outputs
      description: Run repair and generate with build_runner Flutter tests in this project.
    upgrade:
      run: |
        melos exec -- flutter pub upgrade
      description: Run pub upgrade in this project.
