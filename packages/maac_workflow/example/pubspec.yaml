name: maac_workflow_example
description: A Flutter web example app for demonstrating and verifying the maac_workflow package capabilities.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  maac_workflow: ^0.1.0
  maac_mvvm: ^0.2.2
  maac_mvvm_annotation: ^0.0.3
  maac_mvvm_with_get_it: ^0.2.2
  get_it: ^9.2.1
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  maac_mvvm_generator: ^0.0.4

flutter:
  uses-material-design: true
